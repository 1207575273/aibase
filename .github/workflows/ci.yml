# CI —— 每次 PR 与 push 必过。
#
# 为什么必须有: 五条 eslint 架构边界规则如果没有强制执行点,等于没有。
# 而且这里跑的 migrate deploy 会把「schema 改了但没生成迁移」这类漂移暴露出来 ——
# 那种问题在本地开发时完全不可见(本地库早就手工同步过了)。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # 测试直接连真实 PostgreSQL(不 mock 仓储),所以 CI 得有一个。
    # service container 由 runner 管生命周期,比在步骤里手工 docker run 可靠 ——
    # 后者在任何一步失败时都可能留下不被清理的容器。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel_ci_password
          POSTGRES_DB: keel_ci
        ports:
          - 5432:5432
        # 没有 healthcheck 的话,后续步骤会在 PG 还没接受连接时就开始跑,
        # 表现为随机的 ECONNREFUSED —— 重跑一次又好了,最难查的那种
        options: >-
          --health-cmd "pg_isready -U keel -d keel_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # 测试与迁移都读它。CI 里注入的真实环境变量优先于仓库里的 .env
      DATABASE_URL: postgresql://keel:keel_ci_password@127.0.0.1:5432/keel_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 读 .nvmrc,不在这里再写一遍版本号(写两遍必然漂移)
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: lockfile 与 package.json 不一致时直接失败,
      # 而不是悄悄改 lockfile —— 那会让 CI 装到与本地不同的依赖版本
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 架构边界检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      # 用临时库跑真实迁移。这一步顺带验证了迁移文件本身是可执行的
      # 这一步会把「schema 改了但没生成迁移」这类漂移暴露出来 ——
      # 本地开发时完全不可见(本地库早就手工同步过了)
      - name: 应用数据库迁移
        run: pnpm db:deploy

      - name: 单元测试
        run: pnpm test

      - name: 端到端测试
        run: pnpm test:e2e

      # build 放最后: 前面全过了才值得花时间打包
      - name: 构建
        run: pnpm build

      # 镜像构建必须进 CI。
      # 教训: Dockerfile 里曾经 COPY 了两个不存在的路径(packages/ 和 ports.json),
      # docker build 一直是硬失败的,而 CI 只跑 pnpm build 所以完全看不见 ——
      # 直到有人照着 README 敲 `docker compose up` 才会撞上。
      - name: 构建镜像
        run: docker compose -f deploy/docker-compose.prod.yml build
        env:
          POSTGRES_PASSWORD: ci_pg_password
          JWT_SECRET: ci-secret-at-least-32-bytes-long-xxxxxxx

      # [教训] 只 build 不 run **不够**。
      # 镜像能造出来和能跑起来是两回事: 曾经 pnpm workspace 的软链结构搬不进镜像,
      # build 一路成功,docker run 才在 `Cannot find package 'zod'` 上炸。
      # 光看构建结果永远发现不了。这一步真起一套,打一次健康检查再拆掉。
      - name: 容器冒烟
        env:
          POSTGRES_PASSWORD: ci_pg_password
          JWT_SECRET: ci-secret-at-least-32-bytes-long-xxxxxxx
          SEED_ADMIN_PASSWORD: ci-admin-password
          APP_PORT: 7101
        run: |
          set -euo pipefail
          # --wait 会等到所有服务 healthy / 一次性容器成功退出才返回
          docker compose -f deploy/docker-compose.prod.yml up -d --wait

          # 经 nginx 打后端的真探活(它会 ping 数据库)
          curl -fsS http://127.0.0.1:7101/api/health | tee /dev/stderr | grep -q '"db":"up"'

          # 前端静态资源确实被 nginx 发出来了(而不是落到 SPA fallback 或 502)
          curl -fsS -o /dev/null -w '%{content_type}\n' http://127.0.0.1:7101/ | grep -q 'text/html'

          # 登录走通 = 迁移跑了 + 种子灌了 + JWT 签发正常
          curl -fsS -X POST http://127.0.0.1:7101/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin-password"}' | grep -q '"token"'

      - name: 拆掉冒烟环境
        if: always()
        run: docker compose -f deploy/docker-compose.prod.yml down -v
        env:
          POSTGRES_PASSWORD: ci_pg_password
          JWT_SECRET: ci-secret-at-least-32-bytes-long-xxxxxxx
