# nginx —— 生产态的**唯一入口**。
#
# 分工:
#   /        前端静态资源(SPA),nginx 直接发盘上的文件
#   /api/    反代到 app 容器,后端只管 API
#
# 为什么让 nginx 托管前端而不是后端自己发:
#   1. **压缩**。后端的 serveStatic 不做 gzip,一个 240KB 的 bundle 就原样传 240KB;
#      nginx 压完约 78KB。
#   2. **缓存头**。vite 产物是带 hash 的文件名(index-a1b2c3.js),内容变了文件名就变,
#      所以可以放心 immutable 缓存一年;index.html 则必须永不缓存,
#      否则用户会拿着旧 html 去引用已经不存在的 js 文件(白屏,且刷新也不好)。
#      这一条后端那套没法优雅地表达。
#   3. **同源**。前端和 API 在同一个端口同一个域,不存在跨域,也就不需要 CORS。
#
# [端口] 对外只开一个,就是后端原来那个 7101 ——
#   开发时 7101 直连后端,生产时 7101 是 nginx,认知上"服务就在 7101"。
#   不引入 8080/19190 这类新号段,少记一个数字。

server {
    listen       7101;
    server_name  _;

    # 上传/请求体上限。要和后端 config 的 BODY_LIMIT_BYTES(默认 1MB)对齐 ——
    # nginx 这里卡得比后端松没意义(后端还会再拒一次),
    # 卡得比后端紧则会让后端那条 413 的统一错误响应永远走不到,
    # 用户看到的是 nginx 的默认 HTML 错误页而不是 JSON。
    client_max_body_size 1m;

    # 不在响应头里暴露 nginx 版本号
    server_tokens off;

    # ── 压缩 ────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # ── API 反代 ────────────────────────────────────────────
    # [顺序] location /api/ 必须在 location / 之前 —— nginx 的前缀匹配取最长,
    # 顺序其实不影响匹配结果,但写在前面是给人看的:先看清哪些走后端。
    location /api/ {
        # 结尾的斜杠都不能少或多。proxy_pass 带路径时 nginx 会做前缀替换:
        # 请求 /api/users -> http://app:7101/api/users(这里保留 /api 前缀,
        # 因为后端自己就挂在 config.apiPrefix = /api 上)。
        proxy_pass http://app:7101;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 后端不再据此判断 Cookie 的 Secure 标志(登录态早就换成 JWT 了),
        # 但保留它: 日志里能看出用户走的是 http 还是 https
        proxy_set_header X-Forwarded-Proto $scheme;

        # 追踪 id 透传。后端的 requestContext 中间件会沿用上游的 X-Request-Id,
        # 这样一次请求在 nginx access log 和应用 JSONL 日志里能串起来。
        proxy_set_header X-Request-Id      $request_id;

        # 登录要跑 scrypt(单次 64MiB、上百毫秒),默认 60s 足够;
        # 调小到 10s 之类会让高负载下的登录随机失败,很难查。
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 不缓冲响应 —— 业务接口都是小 JSON,缓冲只会增加首字节延迟
        proxy_buffering off;
    }

    # ── 前端静态资源 ────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # 带 hash 的产物可以永久缓存。vite 打包出的 assets/ 下全是
    # name-<hash>.js 这种文件名,内容一变文件名就变,所以 immutable 是安全的。
    # [坑] 不要同时用 `expires` 和 `add_header Cache-Control` ——
    # expires 指令自己会生成一条 Cache-Control,加上 add_header 那条就是
    # **两条 Cache-Control 响应头**,浏览器取哪条不确定。实测确认过。
    # 只用 add_header,一条头把 max-age 和 immutable 都表达完。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # [关键] index.html **绝不能缓存**。
    # 它是唯一一个文件名不带 hash 的入口文件,里面写死了当前这批 assets 的文件名。
    # 缓存了它 = 用户下次访问还拿着旧 html,去请求已经被新版本删掉的 js ->
    # 白屏,而且强刷才能恢复。这是前端部署最常见的事故。
    location = /index.html {
        # 同样只用一条头(理由见上面 /assets/ 的注释)
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA fallback: /users 这类前端路由不是磁盘上的文件,回 index.html 交给前端路由。
    # [注意] 它必须排在 /api/ 之后 —— 否则 API 的 404 会被这里接住返回 HTML,
    # 前端拿到一坨 HTML 去 JSON.parse,报出来的错和真实原因毫无关系。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查用后端的 /api/health(那个是真探活,会 ping 数据库)。
    # nginx 自己这个只表示"反代层活着",给编排系统区分故障层用。
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
