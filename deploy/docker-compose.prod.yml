# 生产环境:nginx 作为唯一入口,对外只开一个端口。
#
#   nginx    唯一入口(7101)。发前端静态资源 + 把 /api 反代给 app
#   app      只跑 API,不暴露端口,无状态(可多实例)
#   migrate  一次性容器: migrate deploy + seed,跑完退出。app 等它成功才启动
#
# 数据库不在这里起 —— 由人配置(与开发 / 测试同一条原则),连接串写在 deploy/.env.prod(不入库,
# init-project 生成)。必须有的键:
#   DATABASE_URL     postgresql://用户:密码@主机:5432/库名
#   DATABASE_SCHEMA  <项目>_prod
#   JWT_SECRET       至少 32 字节;换掉它 = 全员重新登录
#   SEED_ADMIN_PASSWORD  管理员初始密码(首次部署灌种子用,没有则停下)
# 可选: SKIP_SEED=1、APP_PORT、LOG_LEVEL、CONTEXT_PATH
#
# 启动(在 deploy/ 目录):
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# [注意] 这份文件刻意不叫 docker-compose.yml: 默认文件名意味着随手 docker compose up 就起生产。
# 顶层 name 必须写 —— 不写会用目录名 deploy 当项目名,与其他栈混在一起。
name: aibase

services:
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ['./start-migrate.sh']
    labels:
      app.project: aibase
      app.title: AIBase
      app.env: prod
      app.service: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?在 deploy/.env.prod 设置 DATABASE_URL}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:?在 deploy/.env.prod 设置 DATABASE_SCHEMA}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?在 deploy/.env.prod 设置 SEED_ADMIN_PASSWORD}
      SKIP_SEED: ${SKIP_SEED:-0}
      JWT_SECRET: ${JWT_SECRET:?在 deploy/.env.prod 设置 JWT_SECRET}
    restart: 'no'

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # 收养僵尸进程。Dockerfile 的 exec 形式 CMD 已保证信号直达 node,这一行是兜底
    init: true
    labels:
      app.project: aibase
      app.title: AIBase
      app.env: prod
      app.service: app
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?在 deploy/.env.prod 设置 DATABASE_URL}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:?在 deploy/.env.prod 设置 DATABASE_SCHEMA}
      JWT_SECRET: ${JWT_SECRET:?在 deploy/.env.prod 设置 JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-604800}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 容器里日志只走 stdout,由平台采集
      LOG_FILE: ''
      CONTEXT_PATH: ${CONTEXT_PATH:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    labels:
      app.project: aibase
      app.title: AIBase
      app.env: prod
      app.service: nginx
    ports:
      # 对外唯一的端口,与开发态后端端口一致,不用记两套号
      - '${APP_PORT:-7101}:7101'
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7101/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
