# 最小可用编排。生产环境按需加反向代理、日志采集等。
#
# 在本目录跑: docker compose up -d --build
# [注意] context 是 `..`(仓库根)而不是本目录 —— Dockerfile 要 COPY 整个仓库,
# 而它自己住在 deploy/ 下,所以 context 与 dockerfile 必须分开写。
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - '7101:7101'
    volumes:
      # 数据库持久化。删容器不丢数据
      - app-data:/data
    environment:
      # 首次启动会建管理员账号。生产务必改掉,或者不设让它随机生成后看日志
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      LOG_LEVEL: info
      # 容器里不落盘写日志,交给 docker logs / 采集侧
      LOG_FILE: ''
    restart: unless-stopped

volumes:
  app-data:
