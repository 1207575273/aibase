# 测试环境 = 生产的预演:拓扑与 prod 一致,NODE_ENV 也是 production。
#
#   - 入口端口 7104(生产是 7101),两套可以同时跑在一台机器上
#   - 与 prod 的重复是有意的: 测试环境常要临时改东西,独立文件零风险
#
# 数据库不在这里起 —— 由人配置,连接串写在 deploy/.env.test(不入库,init-project 生成)。必须有的键:
#   DATABASE_URL     postgresql://用户:密码@主机:5432/库名
#   DATABASE_SCHEMA  <项目>_test
#   JWT_SECRET       至少 32 字节
# 可选: SEED_ADMIN_PASSWORD、SKIP_SEED=1、APP_PORT、LOG_LEVEL、CONTEXT_PATH
#
# 启动(在 deploy/ 目录):
#   docker compose --env-file .env.test -f docker-compose.test.yml up -d --build
name: aibase-test

services:
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ['./start-migrate.sh']
    labels:
      app.project: aibase
      app.title: AIBase
      app.env: test
      app.service: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?在 deploy/.env.test 设置 DATABASE_URL}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:?在 deploy/.env.test 设置 DATABASE_SCHEMA}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SKIP_SEED: ${SKIP_SEED:-0}
      JWT_SECRET: ${JWT_SECRET:?在 deploy/.env.test 设置 JWT_SECRET}
    restart: 'no'

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    labels:
      app.project: aibase
      app.title: AIBase
      app.env: test
      app.service: app
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?在 deploy/.env.test 设置 DATABASE_URL}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:?在 deploy/.env.test 设置 DATABASE_SCHEMA}
      JWT_SECRET: ${JWT_SECRET:?在 deploy/.env.test 设置 JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-604800}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FILE: ''
      CONTEXT_PATH: ${CONTEXT_PATH:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    labels:
      app.project: aibase
      app.title: AIBase
      app.env: test
      app.service: nginx
    ports:
      - '${APP_PORT:-7104}:7101'
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7101/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
